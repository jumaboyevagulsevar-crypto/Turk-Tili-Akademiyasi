<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-Dars: Salomlashish | Turk Tili Akademiyasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .lesson-content {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
        }

        .vocabulary-list {
            list-style: none;
            margin: 24px 0;
        }

        .vocabulary-list li {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-audio-sm {
            background: rgba(227, 10, 23, 0.1);
            color: var(--accent-red);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lesson-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
        }
    </style>
</head>

<body data-theme="dark">
    <div class="app-container">
        <main class="main-content" style="overflow-y: auto;">
            <div class="lesson-content">
                <header class="page-header">
                    <div class="header-with-back">
                        <a href="platform.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Kursga
                            qaytish</a>
                        <h1>1-Dars: Salomlashish (Selamlaşma)</h1>
                    </div>
                    <p>Turk tilida eng ko'p qo'llaniladigan salomlashish iboralari bilan tanishamiz.</p>
                </header>

                <div class="lesson-card glass-card" style="padding: 30px;">
                    <h3>Kalit so'zlar</h3>
                    <ul class="vocabulary-list">
                        <li>
                            <div class="term"><strong>Merhaba</strong> - Salom</div>
                            <button class="btn-audio-sm" onclick="speak('Merhaba')"><i
                                    class="fa-solid fa-volume-high"></i></button>
                        </li>
                        <li>
                            <div class="term"><strong>Günaydın</strong> - Xayrli tong</div>
                            <button class="btn-audio-sm" onclick="speak('Günaydın')"><i
                                    class="fa-solid fa-volume-high"></i></button>
                        </li>
                        <li>
                            <div class="term"><strong>İyi günler</strong> - Xayrli kun</div>
                            <button class="btn-audio-sm" onclick="speak('İyi günler')"><i
                                    class="fa-solid fa-volume-high"></i></button>
                        </li>
                        <li>
                            <div class="term"><strong>İyi akşamlar</strong> - Xayrli kech</div>
                            <button class="btn-audio-sm" onclick="speak('İyi akşamlar')"><i
                                    class="fa-solid fa-volume-high"></i></button>
                        </li>
                        <li>
                            <div class="term"><strong>Nasılsın?</strong> - Qalaysan?</div>
                            <button class="btn-audio-sm" onclick="speak('Nasılsın?')"><i
                                    class="fa-solid fa-volume-high"></i></button>
                        </li>
                    </ul>

                    <div class="lesson-nav">
                        <button class="btn-outline" onclick="window.location.href='platform.html'">Keyinroq</button>
                        <button class="btn-primary" id="complete-lesson">Darsni yakunlash <i
                                class="fa-solid fa-check"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Audio Logic
        const speak = (text) => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            window.speechSynthesis.speak(utterance);
        };

        document.getElementById('complete-lesson').addEventListener('click', () => {
            // Update lessons count
            let lessons = parseInt(localStorage.getItem('turktili-lessons') || '0');
            if (lessons < 1) {
                localStorage.setItem('turktili-lessons', '1');
            }

            // Update XP
            let xp = parseInt(localStorage.getItem('turktili-xp') || '0');
            localStorage.setItem('turktili-xp', xp + 50);

            window.location.href = 'platform.html';
        });

        // Sync theme
        const savedTheme = localStorage.getItem('turktili-theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
    </script>
</body>

</html>
