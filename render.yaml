services:
  - type: web
    name: turk-tili-akademiyasi
    env: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 18.0.0
      - key: OPENAI_API_KEY
        sync: false
