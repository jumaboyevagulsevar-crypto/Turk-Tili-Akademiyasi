<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C1 Dars 1: Istak Mayli | Turk Tili Akademiyasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body data-theme="dark">
    <div class="app-container">
        <main class="main-content" style="overflow-y: auto;">
            <div class="lesson-content">
                <header class="page-header">
                    <div class="header-with-back">
                        <a href="platform.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Kursga qaytish</a>
                        <h1>C1 - 1-Dars: İstek Kipi (-eyim / -elim)</h1>
                    </div>
                </header>

                <div class="lesson-card glass-card" style="padding: 30px;">
                    <h3>Istak va Taklif bildirish</h3>
                    <p>O'zbek tilidagi <strong>"-ay"</strong> (boray) yoki <strong>"-aylik"</strong> (boraylik) qo'shimchalariga to'g'ri keladi.</p>
                    
                    <ul class="vocabulary-list">
                        <li>
                            <div class="term"><strong>Gideyim</strong> - Boray (Men boray)</div>
                            <button class="btn-audio-sm" onclick="speak('Gideyim')"><i class="fa-solid fa-volume-high"></i></button>
                        </li>
                        <li>
                            <div class="term"><strong>Bakalım</strong> - Ko'raylik / Qaraylik</div>
                            <button class="btn-audio-sm" onclick="speak('Bakalım')"><i class="fa-solid fa-volume-high"></i></button>
                        </li>
                        <li>
                            <div class="term"><strong>Çay içelim mi?</strong> - Choy ichaylikmi? (Taklif)</div>
                            <button class="btn-audio-sm" onclick="speak('Çay içelim mi?')"><i class="fa-solid fa-volume-high"></i></button>
                        </li>
                    </ul>

                    <div class="lesson-nav">
                        <button class="btn-outline" onclick="window.location.href='platform.html'">Keyinroq</button>
                        <button class="btn-primary" id="complete-lesson">Darsni yakunlash <i class="fa-solid fa-check"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const speak = (text) => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            window.speechSynthesis.speak(utterance);
        };
        document.getElementById('complete-lesson').addEventListener('click', () => {
            let xp = parseInt(localStorage.getItem('turktili-xp') || '0');
            localStorage.setItem('turktili-xp', xp + 200);
            let lessons = parseInt(localStorage.getItem('turktili-lessons') || '0');
            localStorage.setItem('turktili-lessons', lessons + 1);
            window.location.href = 'platform.html';
        });
        const savedTheme = localStorage.getItem('turktili-theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
    </script>
</body>

</html>
